name: images

# Pull requests, pushes to main and a weekly run: check, build and test both
# images on both platforms; nothing is published. The weekly run also reports
# pins that have fallen behind their upstream (tests/check-pins.sh).
# A tag publishes one image to GHCR after the same build and test:
#   myzephyr-<version>  ->  ghcr.io/<owner>/myzephyr:<version>
#   zephyr-<version>    ->  ghcr.io/<owner>/zephyr:<version>
# <version> is the release tag the Dockerfile builds (for example
# v2.3.0-sec.2-my.2), optionally followed by -r<N> for an image-only revision.
# Every publish also moves that image's `latest` tag to the published version.
# A tag publishes only if its commit is on main.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['myzephyr-v*', 'zephyr-v*']
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell scripts
        run: shellcheck -s sh docker/common/*.sh deploy/ha/gate/*.sh tests/*.sh
      - name: Versions agree
        run: tests/check-versions.sh
      - name: Site
        run: node site/scripts/check.mjs
      - name: Tunnel gate
        run: |
          set -eu
          tests/gate-test.sh
          docker build -q -t ci/gate:test deploy/ha/gate
          docker run --rm --network none --entrypoint cloudflared ci/gate:test --version
      - name: Compose files
        run: |
          set -eu
          docker compose -f deploy/standalone/compose.yaml config -q
          TUNNEL_TOKEN=x docker compose -f deploy/ha/compose.yaml config -q
          if docker compose -f deploy/ha/compose.yaml config -q 2>/dev/null; then
            echo "deploy/ha accepted a missing TUNNEL_TOKEN" >&2; exit 1
          fi
          img=$(ZEPHYR_IMAGE=example/zephyr:test docker compose -f deploy/standalone/compose.yaml config | grep -c 'image: example/zephyr:test')
          test "$img" = 1

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        image: [myzephyr, zephyr]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: ci/${{ matrix.image }}:test
      - name: Test
        env:
          IMAGE: ${{ matrix.image }}
        run: tests/image-test.sh "ci/$IMAGE:test" "$(cat "docker/$IMAGE/zephyrd-version")"

  # Weekly only: fails when a pinned release, base image or cloudflared version
  # has a successor, which notifies the maintainer.
  pins:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: tests/check-pins.sh

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Image and version from the tag
        id: tag
        run: |
          set -eu
          ref=$GITHUB_REF_NAME
          case "$ref" in
            myzephyr-v*) image=myzephyr; arg=MYZEPHYR_TAG ;;
            zephyr-v*)   image=zephyr;   arg=ZEPHYR_TAG ;;
            *) echo "unexpected tag $ref" >&2; exit 1 ;;
          esac
          expect=$(cat "docker/$image/zephyrd-version")
          version=${ref#"$image"-}
          built=$(grep -m1 "^ARG $arg=" "docker/$image/Dockerfile" | cut -d= -f2)
          case "$version" in
            "$built"|"$built"-r[0-9]*) ;;
            *) echo "tag version $version does not match $arg=$built" >&2; exit 1 ;;
          esac
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "image=$image"
            echo "version=$version"
            echo "expect=$expect"
            echo "ref=ghcr.io/$owner/$image"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ steps.tag.outputs.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: ${{ steps.tag.outputs.ref }}:${{ steps.tag.outputs.version }}-${{ matrix.arch }}
      - name: Test
        env:
          IMAGE: ${{ steps.tag.outputs.ref }}:${{ steps.tag.outputs.version }}-${{ matrix.arch }}
          EXPECT: ${{ steps.tag.outputs.expect }}
        run: tests/image-test.sh "$IMAGE" "$EXPECT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        env:
          IMAGE: ${{ steps.tag.outputs.ref }}:${{ steps.tag.outputs.version }}-${{ matrix.arch }}
        run: docker push "$IMAGE"
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
      version: ${{ steps.tag.outputs.version }}

  manifest:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-platform tag
        env:
          REF: ${{ needs.publish.outputs.ref }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -eu
          docker buildx imagetools create -t "$REF:$VERSION" -t "$REF:latest" \
            "$REF:$VERSION-amd64" "$REF:$VERSION-arm64"
          docker buildx imagetools inspect "$REF:$VERSION"
