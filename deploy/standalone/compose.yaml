# A standalone Zephyr node, no Cloudflare involved.
#
#   docker compose up -d
#   docker compose logs -f zephyrd
#
# P2P (17766) is published so other nodes can connect in. RPC (17767) is
# published on every address of the host, restricted to view-only methods and
# transaction submission, so wallets on your network can use the node. On a
# host with a public address that makes it a public node; RPC_BIND=127.0.0.1
# keeps RPC to the host itself. Docker publishes ports past ufw and firewalld.
name: zephyr-node

services:
  zephyrd:
    # myzephyr (default) or the official release; docker/README.md compares them:
    #   ZEPHYR_IMAGE=ghcr.io/loki-notfound/zephyr:v2.3.0
    image: ${ZEPHYR_IMAGE:-ghcr.io/loki-notfound/myzephyr:v2.3.0-sec.2-my.2}
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      RESTRICTED_RPC: "true"
      # PRUNE: "true"          # keep about a third of the chain data
      # OUT_PEERS: "16"
      # IN_PEERS: "32"
      # LOG_LEVEL: "0"
    ports:
      - "17766:17766"
      - "${RPC_BIND:-0.0.0.0}:17767:17767"
    volumes:
      - zephyrd-data:/data

volumes:
  zephyrd-data:
