# One replica of a highly available public Zephyr RPC node behind Cloudflare
# Tunnel. Run the same file, with the same tunnel token, on every host that
# should serve the hostname. docs/ha-node.md describes the Cloudflare side.
#
#   cp example.env .env        # then put the tunnel token in .env
#   docker compose up -d --build
#
# The connector runs only while zephyrd is healthy and synchronized (gate/):
# a fresh, restarting or lagging replica takes no requests. The tunnel reaches
# zephyrd over the Compose network as http://zephyrd:17767 and needs no
# published port. RPC is also published on the host; see the ports below.
name: zephyr-ha

services:
  zephyrd:
    # myzephyr (default) or the official release; docker/README.md compares them:
    #   ZEPHYR_IMAGE=ghcr.io/loki-notfound/zephyr:v2.3.0
    image: ${ZEPHYR_IMAGE:-ghcr.io/loki-notfound/myzephyr:v2.3.0-sec.2-my.2}
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      RESTRICTED_RPC: "true"
      # Every RPC client arrives from the cloudflared container's address; a ban
      # on RPC errors would lock out all of them at once.
      DISABLE_RPC_BAN: "true"
      HEALTH_REQUIRE_SYNC: "true"
    # Both ports are set in .env, so this file stays as it came and a later
    # "git pull" brings updates without a conflict (docs/ha-node.md).
    ports:
      # P2P, for other Zephyr nodes to connect in. Default: every address of the
      # host. P2P_BIND=127.0.0.1 closes it; the node then connects out only.
      - "${P2P_BIND:-0.0.0.0}:17766:17766"
      # RPC on the host, beside the tunnel. Default: every address of the host,
      # reachable directly, without Cloudflare in front. RPC_BIND=127.0.0.1
      # keeps it to the host itself; the tunnel is then the only way in.
      - "${RPC_BIND:-0.0.0.0}:17767:17767"
    volumes:
      - zephyrd-data:/data

  # Cloudflare's cloudflared binary, taken unchanged from its official image and
  # run by gate/gate.sh, which stops it while zephyrd is unhealthy or behind.
  cloudflared:
    build:
      context: ./gate
      args:
        CLOUDFLARED_IMAGE: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - zephyrd

volumes:
  zephyrd-data:
